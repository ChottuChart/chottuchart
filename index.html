<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chottu Chart EA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Hero Section Container */
    .hero-section {
      position: relative;
      width: 100%;
      height: 100vh; /* Screen full height */
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 8%;
      overflow: hidden;
    }

    /* Background Video - Full Cover */
    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Background-ல் முழுமையாக Fit செய்ய */
      z-index: 1;
    }

    /* Dark Overlay for Text Readability */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45); /* Video மேல Text நல்லா தெரிய Overlay */
      z-index: 2;
    }

    /* Hero Content (Text & Buttons) */
    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 650px;
      color: #ffffff;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .hero-title span {
      color: #f39c12; /* Gold Highlight */
    }

    .hero-description {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e0e0e0;
      margin-bottom: 30px;
    }

    /* Action Buttons */
    .hero-btns {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn-primary {
      background-color: #2b3d52;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #1f2c3c;
    }

    .price-tag {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f1c40f;
    }
  </style>
</head>
<body>

  <!-- HERO SECTION -->
  <section class="hero-section" id="hero">
    
    <!-- Fullscreen Loop Background Video -->
    <video class="bg-video" id="heroVideo" autoplay loop muted playsinline preload="auto">
      <source src="VID-20260731-WA0003.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>

    <!-- Dark Layer for Contrast -->
    <div class="hero-overlay"></div>

    <!-- Content Over Video -->
    <div class="hero-content">
      <div class="badge">✦ SMART AUTOMATED TRADING</div>
      <h1 class="hero-title">Trade Smarter.<br>Win with <span>Chottu Chart EA.</span></h1>
      <p class="hero-description">
        Professional Forex Expert Advisor with built-in risk management and a proven strategy — ready for MT4 & MT5.
      </p>

      <div class="hero-btns">
        <a href="#" class="btn-primary">🚀 Get EA Now</a>
        <span class="price-tag">$250 ONE-TIME</span>
      </div>
    </div>

  </section>

  <!-- JS: Auto Pause/Resume on Scroll -->
  <script>
    const heroVideo = document.getElementById('heroVideo');
    const heroSection = document.getElementById('hero');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          heroVideo.play().catch(() => {});
        } else {
          heroVideo.pause();
        }
      });
    }, { threshold: 0.2 });

    observer.observe(heroSection);
  </script>

</body>
</html>
